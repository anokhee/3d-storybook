# Builds the Storybook on every push to main and publishes it to GitHub
# Pages at https://anokhee.github.io/3d-storybook/
#
# One-time setup in the 3d-storybook repo on github.com:
#   1. Settings → Pages → Source: "GitHub Actions".
#   2. Settings → Secrets and variables → Actions → New repository secret
#      named PROJECTS_TOKEN. Its value is a fine-grained personal access
#      token (github.com → Settings → Developer settings) with read-only
#      "Contents" access to the private project repos (wooden-dollies).
#      The checkout step below uses it to clone the submodules.
name: Deploy Storybook

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.PROJECTS_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build-storybook
      - uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
